<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcClock | Chronometer Pro</title>
    <link rel="icon" type="image/png" href="/logo1.png">
    <style>
        :root {
            --gold: #d4af37;
            --ruby: #9b111e;
            --sapphire: #0f52ba;
            --bg: #050505;
            --accent: var(--gold); 
        }

        body { background: var(--bg); color: var(--accent); font-family: 'Helvetica Neue', Helvetica, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; overflow: hidden; transition: color 1s ease; }
        #ambientCanvas { position: absolute; top: 0; left: 0; z-index: 0; }

        /* Top Nav */
        .top-nav { position: absolute; top: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; z-index: 100; align-items: center; }
        .home-btn img { height: 40px; opacity: 0.6; transition: 0.3s; }
        .home-btn:hover img { opacity: 1; transform: scale(1.05); }
        .settings-btn { background: transparent; border: 1px solid #444; color: #888; padding: 8px 15px; border-radius: 20px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; font-size: 0.6rem; transition: 0.3s; backdrop-filter: blur(5px); }
        .settings-btn:hover { color: var(--gold); border-color: var(--gold); }

        .watch-face { position: relative; text-align: center; z-index: 2; display: flex; flex-direction: column; align-items: center; }

        /* Digital Clock */
        #time { font-size: 8rem; font-weight: 100; letter-spacing: -2px; margin: 0; line-height: 1; text-shadow: 0 0 20px rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }
        .sec-text { font-size: 3rem; color: #555; }
        .ampm-text { font-size: 1.5rem; color: #777; margin-left: 10px; }

        /* Analog Clock */
        .analog-clock { width: 220px; height: 220px; border: 2px solid #333; border-radius: 50%; position: relative; display: none; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.1); margin-bottom: 20px; background: radial-gradient(circle, #111, #000); }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: var(--accent); transform: translateX(-50%); border-radius: 10px; }
        .hour-hand { width: 4px; height: 60px; z-index: 7; }
        .min-hand { width: 2px; height: 90px; z-index: 8; }
        .sec-hand { width: 1px; height: 100px; background: var(--ruby); z-index: 9; }

        #date { font-size: 1.2rem; letter-spacing: 6px; text-transform: uppercase; color: #555; margin-top: 15px; transition: color 0.3s; }

        /* World Clocks */
        .sub-dials { display: flex; gap: 30px; margin-top: 30px; justify-content: center; transition: opacity 0.5s ease; }
        .dial { position: relative; text-align: center; min-width: 100px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .dial:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); }
        .tz-select { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        .dial-time { font-size: 1.5rem; font-weight: 300; letter-spacing: 1px; color: var(--accent); opacity: 0.9; }
        .dial-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #777; margin-top: 5px; }

        /* Controls & Laps */
        .tool-controls { display: none; gap: 15px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .controls { position: absolute; bottom: 40px; display: flex; gap: 15px; z-index: 10; }
        .btn-util { background: rgba(0,0,0,0.6); border: 1px solid #333; color: #888; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; backdrop-filter: blur(5px); }
        .btn-util:hover { border-color: var(--accent); color: var(--accent); }
        .active-status { color: var(--accent) !important; border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
        
        .laps-container { display: none; width: 100%; max-height: 100px; overflow-y: auto; margin-top: 20px; color: #888; font-family: monospace; font-size: 0.9rem; text-align: left; padding: 0 20px; box-sizing: border-box; }
        .lap-item { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 5px 0; }
        
        /* Custom Timer Input */
        .timer-input-group { display: none; margin-bottom: 15px; }
        .timer-input { background: transparent; border: none; border-bottom: 2px solid #333; color: var(--ruby); font-size: 2rem; width: 80px; text-align: center; outline: none; margin: 0 10px; font-family: monospace; transition: 0.3s; }
        .timer-input:focus { border-color: var(--ruby); }

        /* Settings Modal */
        #settings-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.95); border: 1px solid #333; padding: 30px; border-radius: 20px; z-index: 1000; width: 280px; backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        .set-row { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; color: #ccc; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
        
        /* Custom Toggle Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #aaa; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        @media (max-width: 700px) {
            #time { font-size: 4rem; }
            .sub-dials { gap: 10px; flex-wrap: wrap; }
            .controls { flex-wrap: wrap; justify-content: center; padding: 0 20px; bottom: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="ambientCanvas"></canvas>

    <div class="top-nav">
        <a href="/" class="home-btn"><img src="/logo1.png" alt="Home"></a>
        <button class="settings-btn" onclick="toggleSettings()">⚙ Settings</button>
    </div>

    <div class="watch-face">
        <div class="analog-clock" id="analogClock">
            <div class="center-dot"></div>
            <div class="hand hour-hand" id="hrHand"></div>
            <div class="hand min-hand" id="minHand"></div>
            <div class="hand sec-hand" id="secHand"></div>
        </div>

        <h1 id="time">00:00<span class="sec-text" id="sec-text">:00</span><span class="ampm-text" id="ampm-text"></span></h1>
        
        <div class="timer-input-group" id="timerInputs">
            <input type="number" id="t-mins" class="timer-input" value="25" min="1" max="999"> <span style="color:#555">MIN</span>
        </div>

        <div id="date">CALCCLOCK CHRONOMETER</div>

        <div class="sub-dials" id="subDials"></div>

        <div class="tool-controls" id="toolControls">
            <button class="btn-util" id="btn-action">START</button>
            <button class="btn-util" id="btn-lap" style="display:none;">LAP</button>
            <button class="btn-util" id="btn-reset">RESET</button>
            <button class="btn-util" id="btn-exit" style="border-color: #555; color: #ccc;">EXIT</button>
        </div>

        <div class="laps-container" id="lapsContainer"></div>
    </div>

    <div class="controls" id="mainControls">
        <button class="btn-util" id="swBtn">Stopwatch</button>
        <button class="btn-util" id="timerBtn">Custom Timer</button>
        <button class="btn-util" id="wakeBtn">Stay Awake: OFF</button>
        <button class="btn-util" id="fsBtn">Fullscreen</button>
    </div>

    <div id="settings-modal">
        <h3 style="color:var(--gold); margin-top:0; letter-spacing: 2px;">PREFERENCES</h3>
        <div class="set-row">
            <span>24-Hour Format</span>
            <label class="switch"><input type="checkbox" id="set-24h" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
        <div class="set-row">
            <span>Show Seconds</span>
            <label class="switch"><input type="checkbox" id="set-sec" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
        <div class="set-row">
            <span>Analog Clock</span>
            <label class="switch"><input type="checkbox" id="set-analog" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
        <button class="btn-util" style="width: 100%; margin-top: 10px;" onclick="toggleSettings()">CLOSE & SAVE</button>
    </div>

    <script>
        // --- 1. SETTINGS & LOCAL STORAGE ENGINE ---
        let appSettings = JSON.parse(localStorage.getItem('calcClockProSettings')) || {
            format24: false, showSeconds: true, isAnalog: false,
            zones: ['America/New_York', 'Europe/London', 'Asia/Kolkata', 'Asia/Tokyo']
        };

        document.getElementById('set-24h').checked = appSettings.format24;
        document.getElementById('set-sec').checked = appSettings.showSeconds;
        document.getElementById('set-analog').checked = appSettings.isAnalog;

        function saveSettings() {
            appSettings.format24 = document.getElementById('set-24h').checked;
            appSettings.showSeconds = document.getElementById('set-sec').checked;
            appSettings.isAnalog = document.getElementById('set-analog').checked;
            localStorage.setItem('calcClockProSettings', JSON.stringify(appSettings));
            updateClockUI();
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function updateClockUI() {
            document.getElementById('analogClock').style.display = appSettings.isAnalog && currentMode === 'clock' ? 'block' : 'none';
            document.getElementById('time').style.display = appSettings.isAnalog && currentMode === 'clock' ? 'none' : 'block';
            document.getElementById('sec-text').style.display = appSettings.showSeconds ? 'inline' : 'none';
            updateClock();
        }

        // --- 2. AMBIENT BACKGROUND ---
        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [], mouse = { x: -100, y: -100 };
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.5, speedX: (Math.random()-0.5)*0.2, speedY: (Math.random()-0.5)*0.2 });
        }
        function drawAmbient() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
            ctx.globalAlpha = 0.15;
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.x += p.speedX + (mouse.x - canvas.width/2)*0.001; p.y += p.speedY + (mouse.y - canvas.height/2)*0.001;
                if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
            });
            requestAnimationFrame(drawAmbient);
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawAmbient();

        // --- 3. WORLD CLOCK DATABASE ---
        const tzList = [
            { id: 'America/Los_Angeles', name: 'USA (PST)' }, { id: 'America/Chicago', name: 'USA (CST)' },
            { id: 'America/New_York', name: 'USA (EST)' }, { id: 'America/Toronto', name: 'Canada' },
            { id: 'America/Sao_Paulo', name: 'Brazil' }, { id: 'Europe/London', name: 'UK (London)' },
            { id: 'Europe/Paris', name: 'France' }, { id: 'Europe/Berlin', name: 'Germany' },
            { id: 'Europe/Moscow', name: 'Russia' }, { id: 'Africa/Cairo', name: 'Egypt' },
            { id: 'Asia/Dubai', name: 'UAE (Dubai)' }, { id: 'Asia/Kolkata', name: 'India (IST)' },
            { id: 'Asia/Bangkok', name: 'Thailand' }, { id: 'Asia/Shanghai', name: 'China' },
            { id: 'Asia/Tokyo', name: 'Japan (Tokyo)' }, { id: 'Australia/Sydney', name: 'Australia' }
        ].sort((a, b) => a.name.localeCompare(b.name));

        const subDialsContainer = document.getElementById('subDials');

        function buildDials() {
            subDialsContainer.innerHTML = '';
            let optionsHTML = tzList.map(tz => `<option value="${tz.id}">${tz.name}</option>`).join('');

            appSettings.zones.forEach((zoneId, index) => {
                let tzData = tzList.find(t => t.id === zoneId) || tzList[0];
                let dial = document.createElement('div');
                dial.className = 'dial';
                dial.innerHTML = `
                    <select class="tz-select" data-index="${index}">${optionsHTML}</select>
                    <div class="dial-time" id="dial-time-${index}">00:00</div>
                    <div class="dial-label" id="dial-label-${index}">${tzData.name} ▾</div>
                `;
                dial.querySelector('select').value = zoneId;
                dial.querySelector('select').addEventListener('change', (e) => {
                    appSettings.zones[index] = e.target.value;
                    localStorage.setItem('calcClockProSettings', JSON.stringify(appSettings));
                    document.getElementById(`dial-label-${index}`).innerHTML = `${tzList.find(t => t.id === e.target.value).name} ▾`;
                    updateClock();
                });
                subDialsContainer.appendChild(dial);
            });
        }
        buildDials();

        // --- 4. CORE APP LOGIC & TOOLS ---
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const toolControls = document.getElementById('toolControls');
        const mainControls = document.getElementById('mainControls');
        const btnAction = document.getElementById('btn-action');
        const btnReset = document.getElementById('btn-reset');
        const btnExit = document.getElementById('btn-exit');
        const btnLap = document.getElementById('btn-lap');
        const lapsContainer = document.getElementById('lapsContainer');
        const timerInputs = document.getElementById('timerInputs');

        let currentMode = 'clock'; 
        let timerTime = 25 * 60, timerRunning = false, timerInterval;
        let swTime = 0, swRunning = false, swInterval, swStartTime = 0;
        let lapCount = 1;

        // BROWSER-SAFE AUDIO SYSTEM (Ensures Safari/iOS compatibility)
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }

        function setMode(mode) {
            currentMode = mode;
            lapsContainer.style.display = 'none';
            btnLap.style.display = 'none';
            timerInputs.style.display = 'none';
            document.getElementById('sec-text').style.display = appSettings.showSeconds ? 'inline' : 'none';
            document.getElementById('ampm-text').style.display = 'none';
            
            if(mode === 'clock') {
                subDialsContainer.style.display = 'flex';
                toolControls.style.display = 'none';
                mainControls.style.display = 'flex';
                document.documentElement.style.setProperty('--accent', 'var(--gold)');
                dateEl.style.color = '#555';
                updateClockUI();
            } else {
                document.getElementById('analogClock').style.display = 'none';
                document.getElementById('time').style.display = 'block';
                subDialsContainer.style.display = 'none';
                toolControls.style.display = 'flex';
                mainControls.style.display = 'none';
                
                if(mode === 'timer') {
                    document.documentElement.style.setProperty('--accent', 'var(--ruby)');
                    dateEl.innerText = "CUSTOM TIMER";
                    dateEl.style.color = 'var(--ruby)';
                    timerInputs.style.display = timerRunning ? 'none' : 'block';
                    btnAction.innerText = timerRunning ? "PAUSE" : "START";
                    updateTimerDisplay();
                } else if (mode === 'stopwatch') {
                    document.documentElement.style.setProperty('--accent', 'var(--sapphire)');
                    dateEl.innerText = "PRECISION STOPWATCH";
                    dateEl.style.color = 'var(--sapphire)';
                    btnLap.style.display = 'inline-block';
                    lapsContainer.style.display = 'block';
                    btnAction.innerText = swRunning ? "PAUSE" : "START";
                    updateSwDisplay();
                }
            }
        }

        btnAction.addEventListener('click', () => {
            initAudio(); // Unlocks audio engine on direct user gesture

            if(currentMode === 'timer') {
                if(!timerRunning) {
                    // FIX: Safe parsing for empty timer inputs
                    let inputVal = parseInt(document.getElementById('t-mins').value);
                    if (isNaN(inputVal) || inputVal < 1) {
                        inputVal = 25; // Default fallback
                        document.getElementById('t-mins').value = 25;
                    }
                    if(timerTime === 25 * 60 || inputVal * 60 !== timerTime) {
                        timerTime = inputVal * 60;
                    }
                    timerInputs.style.display = 'none';
                }
                timerRunning = !timerRunning;
                btnAction.innerText = timerRunning ? "PAUSE" : "START";
                
                if(timerRunning) {
                    timerInterval = setInterval(() => {
                        timerTime--;
                        if(timerTime <= 0) {
                            clearInterval(timerInterval);
                            timerRunning = false;
                            btnAction.innerText = "START";
                            timerInputs.style.display = 'block';
                            playBeep();
                            alert("TIMER COMPLETE!");
                            timerTime = parseInt(document.getElementById('t-mins').value) * 60;
                        }
                        updateTimerDisplay();
                    }, 1000);
                } else clearInterval(timerInterval);
            } 
            else if (currentMode === 'stopwatch') {
                swRunning = !swRunning;
                btnAction.innerText = swRunning ? "PAUSE" : "START";
                if(swRunning) {
                    swStartTime = Date.now() - swTime;
                    swInterval = setInterval(() => {
                        swTime = Date.now() - swStartTime;
                        updateSwDisplay();
                    }, 10);
                } else clearInterval(swInterval);
            }
        });

        btnLap.addEventListener('click', () => {
            if(swRunning) {
                let div = document.createElement('div');
                div.className = 'lap-item';
                div.innerHTML = `<span>Lap ${lapCount}</span><span>${formatTime(swTime)}</span>`;
                lapsContainer.prepend(div);
                lapCount++;
            }
        });

        btnReset.addEventListener('click', () => {
            if(currentMode === 'timer') {
                clearInterval(timerInterval);
                timerRunning = false;
                
                let inputVal = parseInt(document.getElementById('t-mins').value);
                if (isNaN(inputVal) || inputVal < 1) inputVal = 25;
                
                timerTime = inputVal * 60;
                btnAction.innerText = "START";
                timerInputs.style.display = 'block';
                updateTimerDisplay();
            } else if (currentMode === 'stopwatch') {
                clearInterval(swInterval);
                swRunning = false;
                swTime = 0;
                lapCount = 1;
                lapsContainer.innerHTML = '';
                btnAction.innerText = "START";
                updateSwDisplay();
            }
        });

        btnExit.addEventListener('click', () => setMode('clock'));

        function formatTime(msTime) {
            let totalSecs = Math.floor(msTime / 1000);
            let m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            let s = (totalSecs % 60).toString().padStart(2, '0');
            let ms = Math.floor((msTime % 1000) / 10).toString().padStart(2, '0');
            return `${m}:${s}.${ms}`;
        }

        function updateTimerDisplay() {
            let m = Math.floor(timerTime / 60).toString().padStart(2, '0');
            let s = (timerTime % 60).toString().padStart(2, '0');
            timeEl.innerHTML = `${m}<span class="sec-text">:${s}</span>`;
        }

        function updateSwDisplay() {
            let formatted = formatTime(swTime).split('.');
            timeEl.innerHTML = `${formatted[0]}<span class="sec-text">.${formatted[1]}</span>`;
        }

        function updateClock() {
            if(currentMode !== 'clock') return;
            const now = new Date();
            
            // Analog Logic
            if(appSettings.isAnalog) {
                let hr = now.getHours() % 12;
                let min = now.getMinutes();
                let sec = now.getSeconds();
                document.getElementById('hrHand').style.transform = `translateX(-50%) rotate(${(hr * 30) + (min * 0.5)}deg)`;
                document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${min * 6}deg)`;
                document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${sec * 6}deg)`;
            } 
            // Digital Logic
            else {
                let opts = { hour: '2-digit', minute: '2-digit', hour12: !appSettings.format24 };
                let timeString = now.toLocaleTimeString('en-US', opts); 
                
                let timeParts = timeString.split(' ');
                let baseTime = timeParts[0];
                let ampm = timeParts[1] || '';

                let displayStr = baseTime;
                if(appSettings.showSeconds) {
                    displayStr += `<span class="sec-text">:${now.getSeconds().toString().padStart(2, '0')}</span>`;
                }
                if(!appSettings.format24) {
                    displayStr += `<span class="ampm-text">${ampm}</span>`;
                }
                timeEl.innerHTML = displayStr;
            }

            dateEl.innerText = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

            appSettings.zones.forEach((zone, i) => {
                let el = document.getElementById(`dial-time-${i}`);
                if(el) el.innerText = now.toLocaleTimeString('en-GB', { hour12: !appSettings.format24, hour: '2-digit', minute: '2-digit', timeZone: zone });
            });
        }

        setInterval(updateClock, 1000);
        updateClockUI();

        document.getElementById('timerBtn').addEventListener('click', () => setMode('timer'));
        document.getElementById('swBtn').addEventListener('click', () => setMode('stopwatch'));

        // --- 5. FULLSCREEN & WAKE LOCK ---
        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        let wakeLock = null, isWakeRequested = false;
        const wakeBtn = document.getElementById('wakeBtn');

        async function applyWakeLock() {
            if ('wakeLock' in navigator && isWakeRequested) {
                try { 
                    wakeLock = await navigator.wakeLock.request('screen'); 
                    wakeBtn.innerText = "Stay Awake: ON"; wakeBtn.classList.add('active-status');
                } catch (err) { wakeBtn.innerText = "Awake Error"; }
            }
        }

        wakeBtn.addEventListener('click', () => {
            isWakeRequested = !isWakeRequested;
            if (isWakeRequested) applyWakeLock();
            else { wakeLock?.release(); wakeLock = null; wakeBtn.innerText = "Stay Awake: OFF"; wakeBtn.classList.remove('active-status'); }
        });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && isWakeRequested) applyWakeLock(); });

    </script>
</body>
</html>
