<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Calci AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<style>
body {
  background: #050505;
  color: #e0e0e0;
  font-family: Arial;
  text-align: center;
  padding: 40px;
}

h1 {
  color: gold;
}

input {
  width: 80%;
  padding: 15px;
  font-size: 18px;
  margin-top: 20px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 15px 25px;
  margin: 10px;
  background: gold;
  border: none;
  cursor: pointer;
  border-radius: 10px;
  font-weight: bold;
}

#output {
  margin-top: 20px;
  background: #111;
  padding: 20px;
  border-radius: 10px;
  min-height: 100px;
}
</style>
</head>

<body>

<h1>⚡ CALCI AI</h1>

<input id="input" placeholder="Type your maths problem here...">

<br>

<button onclick="calculate()">🧮 Calculate</button>
<button onclick="askAI()">⚡ Ask Calci (Step-by-step)</button>

<div id="output">Result will appear here...</div>

<script>

// 🔑 PASTE YOUR GEMINI API KEY HERE
const API_KEY = "AIzaSyApQUKGYuOXsM5vf0AxvgtFmiYoUWA0uds";

// NORMAL CALCULATOR
function calculate() {
  try {
    let val = document.getElementById("input").value;
    document.getElementById("output").innerHTML = math.evaluate(val);
  } catch {
    document.getElementById("output").innerHTML = "❌ Invalid input";
  }
}

// AI SOLVER
async function askAI() {

  let problem = document.getElementById("input").value;

  if (!problem) {
    document.getElementById("output").innerHTML = "⚠️ Enter a problem first";
    return;
  }

  document.getElementById("output").innerHTML = "⚡ Calci is solving...";

  try {

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: "Solve step by step like a teacher: " + problem
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    console.log(data); // DEBUG

    if (!data.candidates) {
      document.getElementById("output").innerHTML =
        "❌ API error. Check console (Right click → Inspect → Console)";
      return;
    }

    let result = data.candidates[0].content.parts[0].text;

    document.getElementById("output").innerHTML =
      result.replace(/\n/g, "<br>");

  } catch (err) {
    document.getElementById("output").innerHTML = "❌ " + err.message;
  }
}

</script>

</body>
</html>
