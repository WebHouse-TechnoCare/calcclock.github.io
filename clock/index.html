<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcClock | Chronometer Pro</title>
    <link rel="icon" type="image/png" href="/logo1.png">
    <style>
        :root {
            --gold: #d4af37;
            --ruby: #9b111e;
            --sapphire: #0f52ba;
            --bg: #050505;
            --accent: var(--gold); 
        }

        body {
            background: var(--bg);
            color: var(--accent);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            transition: color 1s ease, background 0.5s;
        }

        #ambientCanvas { position: absolute; top: 0; left: 0; z-index: 0; }

        .home-btn { position: absolute; top: 30px; left: 30px; z-index: 100; transition: transform 0.3s ease; }
        .home-btn img { height: 50px; width: auto; opacity: 0.6; transition: 0.3s; }
        .home-btn:hover img { opacity: 1; transform: scale(1.05); }

        .watch-face { position: relative; text-align: center; z-index: 2; }

        #time {
            font-size: 8rem;
            font-weight: 100;
            letter-spacing: -2px;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #555;
            margin-top: 15px;
            transition: color 0.3s;
        }

        /* World Clock Styles */
        .sub-dials { display: flex; gap: 30px; margin-top: 30px; justify-content: center; transition: opacity 0.5s ease; }
        
        .dial {
            position: relative;
            text-align: center;
            min-width: 100px;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .dial:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); }

        .tz-select {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 10;
        }

        .dial-time { font-size: 1.5rem; font-weight: 300; letter-spacing: 1px; color: var(--accent); opacity: 0.9; }
        .dial-label { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #777; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 4px; }

        /* Dynamic Tool Controls */
        .tool-controls { display: none; gap: 15px; margin-top: 30px; justify-content: center; }
        .controls { position: absolute; bottom: 40px; display: flex; gap: 15px; z-index: 10; }

        .btn-util {
            background: rgba(0,0,0,0.6); border: 1px solid #333; color: #888; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .btn-util:hover { border-color: var(--accent); color: var(--accent); }
        .active-status { color: var(--accent) !important; border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }

        @media (max-width: 700px) {
            #time { font-size: 4.5rem; }
            .sub-dials { gap: 10px; flex-wrap: wrap; }
            .dial { min-width: 120px; }
            .controls { flex-wrap: wrap; justify-content: center; padding: 0 20px; bottom: 20px; }
            .home-btn { top: 15px; left: 15px; }
            .home-btn img { height: 35px; }
        }
    </style>
</head>
<body>

    <canvas id="ambientCanvas"></canvas>

    <a href="/" class="home-btn"><img src="/logo1.png" alt="Home"></a>

    <div class="watch-face">
        <h1 id="time">00:00:00</h1>
        <div id="date">CALCCLOCK CHRONOMETER</div>

        <div class="sub-dials" id="subDials"></div>

        <div class="tool-controls" id="toolControls">
            <button class="btn-util" id="btn-action">START</button>
            <button class="btn-util" id="btn-reset">RESET</button>
            <button class="btn-util" id="btn-exit" style="border-color: #555; color: #ccc;">EXIT MODE</button>
        </div>
    </div>

    <div class="controls" id="mainControls">
        <button class="btn-util" id="swBtn">Stopwatch</button>
        <button class="btn-util" id="pomoBtn">Pomodoro</button>
        <button class="btn-util" id="wakeBtn">Stay Awake: OFF</button>
        <button class="btn-util" id="fsBtn">Fullscreen</button>
    </div>

    <script>
        // --- 1. Ambient Background ---
        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [], mouse = { x: -100, y: -100 };

        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.5, speedX: (Math.random()-0.5)*0.2, speedY: (Math.random()-0.5)*0.2 });
        }
        function drawAmbient() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
            ctx.globalAlpha = 0.15;
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.x += p.speedX + (mouse.x - canvas.width/2)*0.001; p.y += p.speedY + (mouse.y - canvas.height/2)*0.001;
                if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
                if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
            });
            requestAnimationFrame(drawAmbient);
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('resize', initCanvas);
        initCanvas(); drawAmbient();

        // --- 2. MASSIVE GLOBAL TIMEZONE DATABASE ---
        const tzList = [
            { id: 'Pacific/Midway', name: 'Midway (Samoa)' },
            { id: 'Pacific/Honolulu', name: 'USA (Hawaii)' },
            { id: 'America/Anchorage', name: 'USA (Alaska)' },
            { id: 'America/Los_Angeles', name: 'USA (PST)' },
            { id: 'America/Denver', name: 'USA (MST)' },
            { id: 'America/Chicago', name: 'USA (CST)' },
            { id: 'America/New_York', name: 'USA (EST)' },
            { id: 'America/Toronto', name: 'Canada (EST)' },
            { id: 'America/Vancouver', name: 'Canada (PST)' },
            { id: 'America/Mexico_City', name: 'Mexico' },
            { id: 'America/Bogota', name: 'Colombia' },
            { id: 'America/Lima', name: 'Peru' },
            { id: 'America/Caracas', name: 'Venezuela' },
            { id: 'America/Santiago', name: 'Chile' },
            { id: 'America/Buenos_Aires', name: 'Argentina' },
            { id: 'America/Sao_Paulo', name: 'Brazil' },
            { id: 'Atlantic/Reykjavik', name: 'Iceland' },
            { id: 'Europe/London', name: 'UK (London)' },
            { id: 'Europe/Dublin', name: 'Ireland' },
            { id: 'Europe/Lisbon', name: 'Portugal' },
            { id: 'Europe/Paris', name: 'France' },
            { id: 'Europe/Berlin', name: 'Germany' },
            { id: 'Europe/Rome', name: 'Italy' },
            { id: 'Europe/Madrid', name: 'Spain' },
            { id: 'Europe/Amsterdam', name: 'Netherlands' },
            { id: 'Europe/Brussels', name: 'Belgium' },
            { id: 'Europe/Zurich', name: 'Switzerland' },
            { id: 'Europe/Stockholm', name: 'Sweden' },
            { id: 'Europe/Oslo', name: 'Norway' },
            { id: 'Europe/Copenhagen', name: 'Denmark' },
            { id: 'Europe/Warsaw', name: 'Poland' },
            { id: 'Europe/Prague', name: 'Czechia' },
            { id: 'Europe/Vienna', name: 'Austria' },
            { id: 'Europe/Budapest', name: 'Hungary' },
            { id: 'Europe/Athens', name: 'Greece' },
            { id: 'Europe/Bucharest', name: 'Romania' },
            { id: 'Europe/Kyiv', name: 'Ukraine' },
            { id: 'Europe/Moscow', name: 'Russia (MSK)' },
            { id: 'Europe/Istanbul', name: 'Turkey' },
            { id: 'Africa/Cairo', name: 'Egypt' },
            { id: 'Africa/Johannesburg', name: 'South Africa' },
            { id: 'Africa/Lagos', name: 'Nigeria' },
            { id: 'Africa/Nairobi', name: 'Kenya' },
            { id: 'Africa/Casablanca', name: 'Morocco' },
            { id: 'Asia/Jerusalem', name: 'Israel' },
            { id: 'Asia/Riyadh', name: 'Saudi Arabia' },
            { id: 'Asia/Dubai', name: 'UAE (Dubai)' },
            { id: 'Asia/Qatar', name: 'Qatar' },
            { id: 'Asia/Tehran', name: 'Iran' },
            { id: 'Asia/Karachi', name: 'Pakistan' },
            { id: 'Asia/Kolkata', name: 'India (IST)' },
            { id: 'Asia/Colombo', name: 'Sri Lanka' },
            { id: 'Asia/Dhaka', name: 'Bangladesh' },
            { id: 'Asia/Bangkok', name: 'Thailand' },
            { id: 'Asia/Jakarta', name: 'Indonesia' },
            { id: 'Asia/Kuala_Lumpur', name: 'Malaysia' },
            { id: 'Asia/Singapore', name: 'Singapore' },
            { id: 'Asia/Ho_Chi_Minh', name: 'Vietnam' },
            { id: 'Asia/Shanghai', name: 'China (Beijing)' },
            { id: 'Asia/Hong_Kong', name: 'Hong Kong' },
            { id: 'Asia/Taipei', name: 'Taiwan' },
            { id: 'Asia/Seoul', name: 'South Korea' },
            { id: 'Asia/Tokyo', name: 'Japan (Tokyo)' },
            { id: 'Australia/Perth', name: 'Australia (AWST)' },
            { id: 'Australia/Adelaide', name: 'Australia (ACST)' },
            { id: 'Australia/Sydney', name: 'Australia (AEST)' },
            { id: 'Pacific/Auckland', name: 'New Zealand' },
            { id: 'Pacific/Fiji', name: 'Fiji' }
        ];

        tzList.sort((a, b) => a.name.localeCompare(b.name));
        
        let activeZones = ['America/New_York', 'Europe/London', 'Asia/Kolkata', 'Asia/Tokyo'];
        const subDialsContainer = document.getElementById('subDials');

        function buildDials() {
            subDialsContainer.innerHTML = '';
            let optionsHTML = tzList.map(tz => `<option value="${tz.id}">${tz.name}</option>`).join('');

            activeZones.forEach((zoneId, index) => {
                let tzData = tzList.find(t => t.id === zoneId);
                let dial = document.createElement('div');
                dial.className = 'dial';
                dial.innerHTML = `
                    <select class="tz-select" data-index="${index}">
                        ${optionsHTML}
                    </select>
                    <div class="dial-time" id="dial-time-${index}">00:00</div>
                    <div class="dial-label" id="dial-label-${index}">${tzData.name} ▾</div>
                `;
                dial.querySelector('select').value = zoneId;
                dial.querySelector('select').addEventListener('change', (e) => {
                    activeZones[index] = e.target.value;
                    document.getElementById(`dial-label-${index}`).innerHTML = `${tzList.find(t => t.id === e.target.value).name} ▾`;
                    updateClock();
                });
                subDialsContainer.appendChild(dial);
            });
        }
        buildDials();

        // --- 3. Core App State & Logic ---
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const toolControls = document.getElementById('toolControls');
        const mainControls = document.getElementById('mainControls');
        const btnAction = document.getElementById('btn-action');
        const btnReset = document.getElementById('btn-reset');
        const btnExit = document.getElementById('btn-exit');

        let currentMode = 'clock'; 
        let pomoTime = 25 * 60, pomoRunning = false, pomoInterval;
        let swTime = 0, swRunning = false, swInterval, swStartTime = 0;

        function setMode(mode) {
            currentMode = mode;
            if(mode === 'clock') {
                subDialsContainer.style.display = 'flex';
                toolControls.style.display = 'none';
                mainControls.style.display = 'flex';
                document.documentElement.style.setProperty('--accent', 'var(--gold)');
                dateEl.style.color = '#555';
                updateClock();
            } else {
                subDialsContainer.style.display = 'none';
                toolControls.style.display = 'flex';
                mainControls.style.display = 'none';
                
                if(mode === 'pomo') {
                    document.documentElement.style.setProperty('--accent', 'var(--ruby)');
                    dateEl.innerText = "FOCUS SESSION";
                    dateEl.style.color = 'var(--ruby)';
                    btnAction.innerText = pomoRunning ? "PAUSE" : "START";
                    updatePomoDisplay();
                } else if (mode === 'stopwatch') {
                    document.documentElement.style.setProperty('--accent', 'var(--sapphire)');
                    dateEl.innerText = "PRECISION STOPWATCH";
                    dateEl.style.color = 'var(--sapphire)';
                    btnAction.innerText = swRunning ? "PAUSE" : "START";
                    updateSwDisplay();
                }
            }
        }

        btnAction.addEventListener('click', () => {
            if(currentMode === 'pomo') {
                pomoRunning = !pomoRunning;
                btnAction.innerText = pomoRunning ? "PAUSE" : "START";
                if(pomoRunning) {
                    pomoInterval = setInterval(() => {
                        pomoTime--;
                        if(pomoTime <= 0) {
                            clearInterval(pomoInterval);
                            pomoRunning = false;
                            pomoTime = 25 * 60;
                            btnAction.innerText = "START";
                            alert("Session complete! Time for a break.");
                        }
                        updatePomoDisplay();
                    }, 1000);
                } else clearInterval(pomoInterval);
            } 
            else if (currentMode === 'stopwatch') {
                swRunning = !swRunning;
                btnAction.innerText = swRunning ? "PAUSE" : "START";
                if(swRunning) {
                    swStartTime = Date.now() - swTime;
                    swInterval = setInterval(() => {
                        swTime = Date.now() - swStartTime;
                        updateSwDisplay();
                    }, 10);
                } else clearInterval(swInterval);
            }
        });

        btnReset.addEventListener('click', () => {
            if(currentMode === 'pomo') {
                clearInterval(pomoInterval);
                pomoRunning = false;
                pomoTime = 25 * 60;
                btnAction.innerText = "START";
                updatePomoDisplay();
            } else if (currentMode === 'stopwatch') {
                clearInterval(swInterval);
                swRunning = false;
                swTime = 0;
                btnAction.innerText = "START";
                updateSwDisplay();
            }
        });

        btnExit.addEventListener('click', () => setMode('clock'));

        function updatePomoDisplay() {
            let m = Math.floor(pomoTime / 60).toString().padStart(2, '0');
            let s = (pomoTime % 60).toString().padStart(2, '0');
            timeEl.innerText = `${m}:${s}`;
        }

        function updateSwDisplay() {
            let totalSecs = Math.floor(swTime / 1000);
            let m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            let s = (totalSecs % 60).toString().padStart(2, '0');
            let ms = Math.floor((swTime % 1000) / 10).toString().padStart(2, '0');
            timeEl.innerText = `${m}:${s}.${ms}`;
        }

        function updateClock() {
            if(currentMode !== 'clock') return;
            const now = new Date();
            timeEl.innerText = now.toLocaleTimeString('en-GB', { hour12: false });
            dateEl.innerText = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

            activeZones.forEach((zone, i) => {
                let el = document.getElementById(`dial-time-${i}`);
                if(el) el.innerText = now.toLocaleTimeString('en-GB', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: zone });
            });
        }

        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById('pomoBtn').addEventListener('click', () => setMode('pomo'));
        document.getElementById('swBtn').addEventListener('click', () => setMode('stopwatch'));

        // --- 4. Fixed Wake Lock & Fullscreen ---
        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        let wakeLock = null;
        let isWakeRequested = false;
        const wakeBtn = document.getElementById('wakeBtn');

        async function applyWakeLock() {
            if ('wakeLock' in navigator && isWakeRequested) {
                try { 
                    wakeLock = await navigator.wakeLock.request('screen'); 
                    wakeBtn.innerText = "Stay Awake: ON";
                    wakeBtn.classList.add('active-status');
                } catch (err) { wakeBtn.innerText = "Awake Error"; }
            }
        }

        wakeBtn.addEventListener('click', () => {
            isWakeRequested = !isWakeRequested;
            if (isWakeRequested) applyWakeLock();
            else {
                wakeLock?.release();
                wakeLock = null;
                wakeBtn.innerText = "Stay Awake: OFF";
                wakeBtn.classList.remove('active-status');
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isWakeRequested) applyWakeLock();
        });

    </script>
</body>
</html>
